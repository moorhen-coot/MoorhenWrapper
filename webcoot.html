<!doctype html>
<html lang="en" class="stop-scrolling">
    <head>
        <title>Moorhen</title>
        <base href="[[baseurl]]" />
        <meta charset="utf-8" />
        <link rel="icon" href="./favicon.ico" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="Moorhen is a molecular graphics web application based on the Coot desktop program."
        />
        <link rel="apple-touch-icon" href="./public/logo192.png" />
        <link rel="manifest" href="./manifest.json" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
            // See https://github.com/facebook/react/issues/20829#issuecomment-802088260
            if (!crossOriginIsolated) SharedArrayBuffer = ArrayBuffer;
        </script>
        <script src="./moorhen.js" charset="utf-8"></script>
        <script type="text/javascript" defer="defer">
            const rootId = "root";
            const inputFiles = [
                { type: "ligand", url: "./MoorhenAssets/tutorials/NUT.cif", codes: ["NUT"] },
                { type: "pdb", url: "./MoorhenAssets/tutorials/moorhen-tutorial-structure-number-1.ent", name: "mol-1" },
                {
                    type: "mtz",
                    url: `./MoorhenAssets/tutorials/moorhen-tutorial-map-number-1.mtz`,
                    maps: [
                        {
                            name: "map-1",
                            columns: { F: "FWT", PHI: "PHWT", Fobs: "FP", SigFobs: "SIGFP", FreeR: "FREE" },
                            calcStructFact: true,
                            style: { colour: { r: 0.0, g: 0.0, b: 1.0 } },
                            active: true,
                        },
                        {
                            name: "diff-map-1",
                            columns: { F: "DELFWT", PHI: "PHDELWT" },
                            isDifference: true,
                            style: {
                                positiveColour: { r: 0.0, g: 1.0, b: 0.0 },
                                negativeColour: { r: 1.0, g: 0.0, b: 0.0 },
                            },
                        },
                    ],
                },
            ];
            // Standalone test page: the same calls as jsCoFE's ccp4cloud/webcoot.js, with console logging
            // instead of CCP4 Cloud callbacks (backups are kept in memory)
            const absoluteURL = (url) => new URL(url, document.baseURI).href;
            const backups = new Map();
            // the molecule is named after the file name without its extension: keep the source's extension
            const extension = (url) => new URL(absoluteURL(url)).pathname.match(/\.(pdb|ent|cif|mmcif)$/i)?.[0] ?? ".pdb";

            (async () => {
                moorhen.registerMoorhenWebComponent();
                const element = document.createElement("moorhen-web-component");
                element.urlPrefix = absoluteURL("./MoorhenAssets");
                element.allowScripting = false;
                element.disableFileUploads = true;
                element.backupStorage = moorhen.createCallbackBackupStorage({
                    save: async (backup) => void backups.set(backup.serNo, backup),
                    load: async (serNo) => backups.get(serNo),
                    remove: async (serNo) => void backups.delete(serNo),
                    list: async () => [...backups.values()],
                });
                // fill the page: no default body margin, no page scrollbars
                document.documentElement.style.height = "100%";
                document.body.style.cssText += "height:100%;margin:0;overflow:hidden;";
                document.getElementById(rootId).style.height = "100%";
                element.style.height = "100%";
                document.getElementById(rootId).appendChild(element);
                const instance = await element.getMoorhenInstance();

                instance.preferences.onChange((stored) => console.log("preferences", stored));
                instance.menuSystem.addMainMenu({
                    type: "action",
                    label: "Exit",
                    icon: "MatSymLogout",
                    action: async () => console.log("exit", await moorhen.getCloudExitData(instance)),
                });

                for (const f of inputFiles.filter((f) => f.type === "ligand")) {
                    await moorhen.loadCloudDictionary(instance, absoluteURL(f.url), f.codes);
                }
                await Promise.all(
                    inputFiles.map((f) =>
                        f.type === "pdb"
                            ? instance.files.loadFiles({ url: absoluteURL(f.url), filename: f.name + extension(f.url) }, "cloud")
                            : f.type === "mtz"
                              ? instance.files.loadMtz(absoluteURL(f.url), f.maps, "cloud")
                              : null,
                    ),
                );
            })();
        </script>
    </body>
</html>
